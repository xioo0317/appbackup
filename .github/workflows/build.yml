name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  host-check:
    name: host compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ zlib1g-dev

      # 主机版只做编译检查：内嵌的是 aarch64 二进制，在 x86 上不可执行（运行时会回退系统 tar）
      - name: Configure
        run: cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release -DAPP_HOST_CHECK=ON

      - name: Build
        run: cmake --build build-host -j"$(nproc)"

      - name: CLI smoke
        run: |
          ./build-host/appbackup --version
          ./build-host/appbackup --help | head -5

  android:
    name: android arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Check embedded tools
        run: |
          set -e
          for t in tar zstd; do
            f="prebuilt/arm64-v8a/$t"
            test -f "$f" || { echo "缺少 $f"; exit 1; }
            echo "$f: $(file -b "$f")"
          done

      - name: Configure
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-android -j"$(nproc)"

      - name: Strip
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            build-android/appbackup
          ls -lh build-android/appbackup
          file build-android/appbackup

      - name: Package
        run: |
          mkdir -p dist
          cp build-android/appbackup dist/appbackup-arm64-v8a
          cd dist && zip -9 appbackup-arm64-v8a.zip appbackup-arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: appbackup-arm64-v8a
          path: dist/appbackup-arm64-v8a.zip
          if-no-files-found: error
