name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  host-check:
    name: host compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ zlib1g-dev

      # 主机版只做编译检查：内嵌的是 aarch64 二进制，在 x86 上不可执行（运行时会回退系统 tar）
      - name: Configure
        run: cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release -DAPP_HOST_CHECK=ON

      - name: Build
        run: cmake --build build-host -j"$(nproc)"

      - name: CLI smoke
        run: |
          ./build-host/appbackup --version
          ./build-host/appbackup --help | head -5

  android:
    name: android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            api: 21
          - abi: armeabi-v7a
            api: 21
          - abi: x86_64
            api: 21
          - abi: x86
            api: 21
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Check embedded tools
        run: |
          set -e
          for t in tar zstd; do
            f="prebuilt/${{ matrix.abi }}/$t"
            test -f "$f" || { echo "缺少 $f"; exit 1; }
            echo "$f: $(file -b "$f")"
          done

      - name: Configure
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cmake -S . -B "build-${{ matrix.abi }}" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${{ matrix.api }} \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "build-${{ matrix.abi }}" -j"$(nproc)"

      - name: Strip
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            "build-${{ matrix.abi }}/appbackup"
          ls -lh "build-${{ matrix.abi }}/appbackup"
          file "build-${{ matrix.abi }}/appbackup"

      - name: Package
        run: |
          mkdir -p dist
          cp "build-${{ matrix.abi }}/appbackup" "dist/appbackup-${{ matrix.abi }}"
          cd dist && zip -9 "appbackup-${{ matrix.abi }}.zip" "appbackup-${{ matrix.abi }}"

      - uses: actions/upload-artifact@v4
        with:
          name: appbackup-${{ matrix.abi }}
          path: dist/appbackup-${{ matrix.abi }}.zip
          if-no-files-found: error
